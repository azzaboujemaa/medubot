<div
  *ngIf="user"
  class="max-w-xl mx-auto bg-blue-900 bg-opacity-40 p-8 rounded-xl text-white backdrop-blur-lg"
>

  <h2 class="text-3xl font-bold text-center mb-6">
    Mon Profil
  </h2>

  <div class="space-y-4">

    <!-- NOM -->
    <div>
      <label class="block text-blue-300">
        Nom
      </label>

      <input
        [value]="user.name"
        disabled
        class="w-full p-2 rounded bg-gray-300 text-black"
      />
    </div>

    <!-- EMAIL -->
    <div>
      <label class="block text-blue-300">
        Email
      </label>

      <input
        [value]="user.email"
        disabled
        class="w-full p-2 rounded bg-gray-300 text-black"
      />
    </div>

    <!-- STATUT MISSION -->
    <div>
      <label class="block text-blue-300">
        Statut mission
      </label>

      <select
        [(ngModel)]="missionStatus"
        class="w-full p-2 rounded bg-white text-black"
      >
        <option value="ACTIVE">
          En cours
        </option>

        <option value="COMPLETED">
          Terminée
        </option>

        <option value="CANCELLED">
          Annulée
        </option>
      </select>
    </div>

  </div>

  <!-- BUTTON -->
  <button
    class="mt-6 w-full bg-blue-500 hover:bg-blue-600 p-3 rounded-xl font-bold"
    (click)="saveMission()"
  >
    Enregistrer
  </button>

</div>
