<div class="employees-page">

  <div class="employees-header">
    <h2>Gestion des employés</h2>
    <button class="btn-add" (click)="addEmployee()">
      ➕ Ajouter un employé
    </button>
  </div>

  <div class="employees-table">

    <div class="table-header">
      <span>Nom</span>
      <span>Email</span>
      <span>Rôle</span>
      <span>Actions</span>
    </div>

    @for (emp of employees$ | async; track emp.id) {
      <div class="table-row">
        <span>{{ emp.name }}</span>
        <span>{{ emp.email }}</span>
        <span class="role">{{ getRoleLabel(emp.role) }}</span>
        <div class="actions">
          <button class="btn-edit" (click)="editEmployee(emp)">✏️</button>
          <button class="btn-delete" (click)="deleteEmployee(emp.id)">🗑️</button>
        </div>
      </div>
    }

  </div>

</div>
