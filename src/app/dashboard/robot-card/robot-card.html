<div class="bg-blue-900 bg-opacity-40 rounded-xl p-8 backdrop-blur-lg flex flex-col items-center justify-start space-y-4">

  <img src="assets/images/medubot.png" class="w-40 mx-auto" />

  <p class="text-center text-xl font-semibold opacity-90">
    Medubot{{ robotId }}
  </p>

  @if (hasMission) {

    <div class="w-full space-y-1 text-sm">
      <div class="flex justify-between text-blue-200">
        <span>Zone</span>
        <span class="text-white font-semibold">{{ missionZone }}</span>
      </div>
      <div class="flex justify-between text-blue-200">
        <span>Début</span>
        <span class="text-white font-semibold">{{ missionStartDate }}</span>
      </div>
      <div class="flex justify-between text-blue-200">
  <span>Fin</span>

  <span class="text-white font-semibold">

    @if (missionEndDate) {

      {{ missionEndDate }}

    } @else {

      En cours

    }

  </span>
</div>
     <div class="flex justify-between text-blue-200">

  <span>Statut</span>

  <span
    class="font-semibold"
    [ngClass]="{
      'text-green-300': missionStatus === 'ACTIVE',
      'text-yellow-300': missionStatus === 'COMPLETED',
      'text-red-300': missionStatus === 'CANCELLED'
    }"
  >

    {{ getStatusLabel(missionStatus) }}

  </span>

</div>
    </div>
  } @else {
    <p class="text-center text-sm text-blue-400">Aucune mission active</p>
  }

  <div class="text-center text-2xl font-bold pt-2">Méduses/jour</div>

  <div class="flex items-center justify-center space-x-2 text-gray-300 text-lg">
    <i class="fas fa-weight-hanging"></i>
    <span>28 kg collectés</span>
  </div>

  <div class="mt-4 text-center">
    <div class="text-xl font-semibold mb-4">30 méduses collectées</div>
    <div class="relative w-40 h-24 mx-auto">
      <svg class="absolute top-0 left-0 w-full h-full" viewBox="0 0 100 50">
        <path d="M10 50 A40 40 0 0 1 90 50" stroke="#9DBDEB" stroke-width="10" fill="none" stroke-linecap="round"/>
      </svg>
      <svg class="absolute top-0 left-0 w-full h-full" viewBox="0 0 100 50">
        <path d="M10 50 A40 40 0 0 1 90 50" stroke="#4BA3FF" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="126" stroke-dashoffset="calc(126 - (126 * 30 / 100))"/>
      </svg>
      <div class="absolute inset-0 flex flex-col items-center justify-center pt-3">
        <span class="text-3xl font-bold">30</span>
      </div>
    </div>
  </div>

</div>
