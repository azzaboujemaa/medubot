<div
  class="h-screen bg-blue-900 flex flex-col justify-between transition-all duration-300"
  [class.w-20]="!isOpen"
  [class.w-64]="isOpen"
  (mouseenter)="openSidebar()"
  (mouseleave)="closeSidebar()"
>

  <!-- TOP -->
  <div class="flex flex-col items-center mt-6 space-y-10">

    <!-- LOGO -->
    <img src="assets/images/logo.jpg" class="w-12 opacity-90" />

    <!-- SUPERVISION -->
    

    <div class="sidebar-item" (click)="goRobots()">
      <i class="fas fa-robot"></i>
      <span *ngIf="isOpen">Robots</span>
    </div>

<div class="sidebar-item" (click)="goMissions()">
  <i class="fas fa-clipboard-list"></i>
  <span *ngIf="isOpen">Missions</span>
</div>

   <div
  class="sidebar-item"
  routerLink="/admin/robots-map"
  routerLinkActive="active">
  <i class="fas fa-map-location-dot"></i>
  <span *ngIf="isOpen">Carte des robots</span>
</div>

    <!-- GESTION -->
    <div class="sidebar-item" (click)="goEmployees()">
      <i class="fas fa-users"></i>
      <span *ngIf="isOpen">Employés</span>
    </div>

    <div class="sidebar-item" (click)="goCreateEmployee()">
  <i class="fas fa-user-plus"></i>
  <span *ngIf="isOpen">Créer un compte</span>
</div>

    

    <!-- ANALYSE -->
    <div class="sidebar-item" (click)="goPartners()">
      <i class="fas fa-handshake"></i>
      <span *ngIf="isOpen">Partenaires</span>
    </div>

  <div class="sidebar-item" (click)="goJellyfishAnalytics()">
  <i class="fas fa-chart-pie"></i>
  <span *ngIf="isOpen">Répartition des méduses</span>
</div>


  </div>
 <!-- CHAT -->
<div class="sidebar-item relative" (click)="goChat()">
  <i class="fas fa-comments"></i>
  <span *ngIf="isOpen">Chat techniciens</span>

  <!-- Badge non lus — positionné en absolu, ne perturbe pas la ligne -->
  <span
    *ngIf="hasUnread && isOpen"
    class="ml-auto bg-red-500 text-white text-xs font-bold px-1.5 py-0.5 rounded-full"
  >
    {{ unreadCount }}
  </span>

  <!-- Point rouge quand sidebar fermée -->
  <span
    *ngIf="hasUnread && !isOpen"
    class="absolute top-0 right-0 w-2.5 h-2.5 bg-red-500 rounded-full border-2 border-blue-900"
  ></span>
</div>

  <!-- BOTTOM -->
  <div class="mb-6 flex justify-center">
    <div class="sidebar-item text-red-300 hover:text-red-100" (click)="logout()">
      <i class="fas fa-sign-out-alt"></i>
      <span *ngIf="isOpen">Logout</span>
    </div>
  </div>

</div>
